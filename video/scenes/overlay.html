<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="../out/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: transparent;
        font-family: 'Fraunces Variable', Georgia, serif;
      }
      #cap {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        max-width: 1060px;
        padding: 8px 18px;
        border-radius: 10px;
        background: rgb(8 7 12 / 0.8);
        color: var(--paper);
        font-size: 22px;
        line-height: 1.35;
        text-align: center;
      }
      #label {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--seal);
        background: rgb(8 7 12 / 0.75);
        color: var(--seal);
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      #cap:empty,
      #label:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <div id="cap"></div>
    <script>
      window.show = (text, label) => {
        document.getElementById('cap').textContent = text;
        document.getElementById('label').textContent = label;
      };
    </script>
  </body>
</html>
